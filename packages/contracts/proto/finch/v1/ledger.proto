syntax = "proto3";

package finch.v1;

import "finch/v1/common.proto";

service LedgerService {
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
}

message LedgerAccount {
  string id = 1;
  string name = 2;
  string currency = 3;
  Money available_balance = 4;
  Money current_balance = 5;
  // Absent when the provider does not supply an IBAN.
  optional string iban = 6;
  string account_type = 7;
}

message LedgerTransaction {
  string id = 1;
  string account_id = 2;
  Money amount = 3;
  string booking_date = 4;
  // Absent when the provider does not supply a value date.
  optional string value_date = 5;
  string description = 6;
  // Absent when the source does not supply a merchant.
  optional string merchant = 7;
  string status = 8;
}

message ListAccountsRequest {
  string workspace_id = 1;
  PageRequest page = 2;
}

message ListAccountsResponse {
  repeated LedgerAccount accounts = 1;
  PageResponse page = 2;
}

message GetAccountRequest {
  string workspace_id = 1;
  string account_id = 2;
}

message GetAccountResponse {
  LedgerAccount account = 1;
}

message ListTransactionsRequest {
  string workspace_id = 1;
  string account_id = 2;
  PageRequest page = 3;
}

message ListTransactionsResponse {
  repeated LedgerTransaction transactions = 1;
  PageResponse page = 2;
}

message GetTransactionRequest {
  string workspace_id = 1;
  string transaction_id = 2;
}

message GetTransactionResponse {
  LedgerTransaction transaction = 1;
}
