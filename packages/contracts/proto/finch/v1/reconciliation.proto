syntax = "proto3";

package finch.v1;

import "finch/v1/common.proto";

service ReconciliationService {
  rpc ListUnmatched(ListUnmatchedRequest) returns (ListUnmatchedResponse);
  rpc Match(MatchRequest) returns (MatchResponse);
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);
  rpc Reject(RejectRequest) returns (RejectResponse);
}

enum ReconciliationStatus {
  RECONCILIATION_STATUS_UNSPECIFIED = 0;
  RECONCILIATION_STATUS_PROPOSED = 1;
  RECONCILIATION_STATUS_CONFIRMED = 2;
  RECONCILIATION_STATUS_REJECTED = 3;
}

message UnmatchedReceipt {
  string receipt_id = 1;
  string merchant = 2;
  Money total = 3;
  string receipt_date = 4;
}

message ReconciliationMatch {
  string transaction_id = 1;
  string receipt_id = 2;
  double score = 3;
  ReconciliationStatus status = 4;
  string rejection_reason = 5;
}

message ListUnmatchedRequest {
  string workspace_id = 1;
  PageRequest page = 2;
}

message ListUnmatchedResponse {
  repeated UnmatchedReceipt receipts = 1;
  PageResponse page = 2;
}

message MatchRequest {
  string workspace_id = 1;
}

message MatchResponse {
  repeated ReconciliationMatch matches = 1;
}

message ConfirmRequest {
  string workspace_id = 1;
  string transaction_id = 2;
  string receipt_id = 3;
}

message ConfirmResponse {
  ReconciliationMatch match = 1;
}

message RejectRequest {
  string workspace_id = 1;
  string transaction_id = 2;
  string receipt_id = 3;
  string reason = 4;
}

message RejectResponse {
  ReconciliationMatch match = 1;
}
