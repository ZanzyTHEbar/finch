syntax = "proto3";

package finch.v1;

import "finch/v1/common.proto";

service PrivacyService {
  rpc GetDataPrivacyStatus(GetDataPrivacyStatusRequest) returns (GetDataPrivacyStatusResponse);
  rpc RequestDataExport(RequestDataExportRequest) returns (RequestDataExportResponse);
  rpc GetDataExportDownloadUrl(GetDataExportDownloadUrlRequest) returns (GetDataExportDownloadUrlResponse);
  rpc RequestWorkspaceDeletion(RequestWorkspaceDeletionRequest) returns (RequestWorkspaceDeletionResponse);
}

enum DataExportStatus {
  DATA_EXPORT_STATUS_UNSPECIFIED = 0;
  DATA_EXPORT_STATUS_QUEUED = 1;
  DATA_EXPORT_STATUS_RUNNING = 2;
  DATA_EXPORT_STATUS_READY = 3;
  DATA_EXPORT_STATUS_FAILED = 4;
  DATA_EXPORT_STATUS_EXPIRED = 5;
}

message DataExport {
  string id = 1;
  DataExportStatus status = 2;
  // RFC 3339 timestamps.
  string created_at = 3;
  string expires_at = 4;
}

message DataPrivacyStatus {
  repeated DataExport exports = 1;
  Job workspace_deletion_job = 2;
}

message GetDataPrivacyStatusRequest {
  string workspace_id = 1;
}

message GetDataPrivacyStatusResponse {
  DataPrivacyStatus status = 1;
}

message RequestDataExportRequest {
  string workspace_id = 1;
  // Required non-empty opaque client key. Replays atomically return the
  // original export job and never enqueue a duplicate export.
  string idempotency_key = 2;
}

message RequestDataExportResponse {
  DataExport export = 1;
  Job job = 2;
}

message GetDataExportDownloadUrlRequest {
  string workspace_id = 1;
  string export_id = 2;
}

message GetDataExportDownloadUrlResponse {
  DownloadUrl download = 1;
}

message RequestWorkspaceDeletionRequest {
  string workspace_id = 1;
  // Must be true to explicitly confirm this destructive operation.
  bool confirmed = 2;
  // Required non-empty opaque client key. Replays atomically return the
  // original deletion job and never enqueue a duplicate deletion.
  string idempotency_key = 3;
}

message RequestWorkspaceDeletionResponse {
  Job job = 1;
}
