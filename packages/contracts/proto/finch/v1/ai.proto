syntax = "proto3";

package finch.v1;

import "finch/v1/common.proto";

service AiService {
  rpc GetAiPolicy(GetAiPolicyRequest) returns (GetAiPolicyResponse);
  rpc SetAiPolicy(SetAiPolicyRequest) returns (SetAiPolicyResponse);
  rpc QueueSummary(QueueSummaryRequest) returns (QueueSummaryResponse);
}

message AiPolicy {
  bool enabled = 1;
  bool summaries_enabled = 2;
  string summary_model = 3;
}

message GetAiPolicyRequest {
  string workspace_id = 1;
}

message GetAiPolicyResponse {
  AiPolicy policy = 1;
}

message SetAiPolicyRequest {
  string workspace_id = 1;
  AiPolicy policy = 2;
}

message SetAiPolicyResponse {
  AiPolicy policy = 1;
}

message QueueSummaryRequest {
  string workspace_id = 1;
  string period_start = 2;
  string period_end = 3;
  // Required non-empty opaque client key. Replays atomically return the
  // original job and never enqueue a duplicate summary.
  string idempotency_key = 4;
}

message QueueSummaryResponse {
  Job job = 1;
}
