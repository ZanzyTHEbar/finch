syntax = "proto3";

package finch.v1;

// A workspace_id in a request is a caller-requested scope, never authority.
// Adapters derive a trusted PrincipalContext from verified credentials, and lib
// authorizes the principal's membership of the requested workspace. Callers
// cannot select a tenant, principal, or role through these contracts.

message Money {
  // Decimal minor units preserve precision across JavaScript and JSON clients.
  string minor_units = 1;
  string currency = 2;
}

message PageRequest {
  // 0 uses the service default of 50; a non-zero value is capped at 100.
  uint32 page_size = 1;
  // Opaque token returned by the preceding page. For workspace-scoped lists,
  // tokens are bound to that workspace and are invalid for any other scope.
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}

message DownloadUrl {
  string url = 1;
  // RFC 3339 timestamp.
  string expires_at = 2;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
}

message Job {
  string id = 1;
  string workspace_id = 2;
  JobStatus status = 3;
  // RFC 3339 timestamps.
  string created_at = 4;
  string updated_at = 5;
  string failure_reason = 6;
}
