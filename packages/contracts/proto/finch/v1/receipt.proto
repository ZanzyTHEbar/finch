syntax = "proto3";

package finch.v1;

import "finch/v1/common.proto";

service ReceiptService {
  rpc ListReceipts(ListReceiptsRequest) returns (ListReceiptsResponse);
  rpc GetReceipt(GetReceiptRequest) returns (GetReceiptResponse);
  rpc CreateReceiptUploadIntent(CreateReceiptUploadIntentRequest) returns (CreateReceiptUploadIntentResponse);
  rpc FinalizeReceipt(FinalizeReceiptRequest) returns (FinalizeReceiptResponse);
  rpc GetReceiptDownloadUrl(GetReceiptDownloadUrlRequest) returns (GetReceiptDownloadUrlResponse);
}

enum ReceiptStatus {
  RECEIPT_STATUS_UNSPECIFIED = 0;
  RECEIPT_STATUS_UPLOAD_PENDING = 1;
  RECEIPT_STATUS_UPLOADED = 2;
  RECEIPT_STATUS_PROCESSING = 3;
  RECEIPT_STATUS_READY = 4;
  RECEIPT_STATUS_FAILED = 5;
}

enum UploadHttpMethod {
  UPLOAD_HTTP_METHOD_UNSPECIFIED = 0;
  UPLOAD_HTTP_METHOD_PUT = 1;
  UPLOAD_HTTP_METHOD_POST = 2;
}

message UploadHeader {
  string name = 1;
  string value = 2;
}

// Storage upload instructions. This is intentionally distinct from DownloadUrl.
message UploadTarget {
  string url = 1;
  UploadHttpMethod method = 2;
  repeated UploadHeader required_headers = 3;
}

message Receipt {
  string id = 1;
  ReceiptStatus status = 2;
  // Absent for rows created by the legacy Edge route before migration.
  optional string file_name = 3;
  string content_type = 4;
  optional string merchant = 5;
  Money total = 6;
  optional string receipt_date = 7;
  // RFC 3339 timestamp.
  string created_at = 8;
}

message ListReceiptsRequest {
  string workspace_id = 1;
  PageRequest page = 2;
}

message ListReceiptsResponse {
  repeated Receipt receipts = 1;
  PageResponse page = 2;
}

message GetReceiptRequest {
  string workspace_id = 1;
  string receipt_id = 2;
}

message GetReceiptResponse {
  Receipt receipt = 1;
}

message CreateReceiptUploadIntentRequest {
  string workspace_id = 1;
  string file_name = 2;
  string content_type = 3;
  uint64 content_length = 4;
  // Required lowercase hexadecimal SHA-256 of the uploaded bytes.
  string sha256 = 5;
  // Required non-empty opaque client key. Atomic replays return the original
  // receipt and a usable fresh upload target without creating another upload
  // intent. The signed URL itself may rotate.
  string idempotency_key = 6;
  optional string merchant = 7;
  // Optional non-negative total in decimal minor units and uppercase ISO currency.
  Money total = 8;
  optional string receipt_date = 9;
}

message CreateReceiptUploadIntentResponse {
  Receipt receipt = 1;
  UploadTarget upload = 2;
}

message FinalizeReceiptRequest {
  string workspace_id = 1;
  string receipt_id = 2;
}

message FinalizeReceiptResponse {
  Receipt receipt = 1;
}

message GetReceiptDownloadUrlRequest {
  string workspace_id = 1;
  string receipt_id = 2;
}

message GetReceiptDownloadUrlResponse {
  DownloadUrl download = 1;
}
