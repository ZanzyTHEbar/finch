syntax = "proto3";

package finch.v1;

import "finch/v1/common.proto";

service SearchService {
  rpc SearchFinance(SearchFinanceRequest) returns (SearchFinanceResponse);
}

message FinanceSearchHit {
  string entity_id = 1;
  string entity_type = 2;
  string title = 3;
  string snippet = 4;
  double fused_score = 5;
  optional uint32 dense_rank = 6;
  optional uint32 lexical_rank = 7;
  optional double dense_similarity = 8;
  optional double lexical_score = 9;
  repeated string sources = 10;
}

message SearchDiagnostics {
  uint32 dense_candidates = 1;
  uint32 lexical_candidates = 2;
  uint32 fused_candidates = 3;
}

message SearchFinanceRequest {
  string workspace_id = 1;
  string query = 2;
  // 0 uses the service default.
  uint32 top_k = 3;
  // Per-source candidate fan-out. 0 uses the service default.
  uint32 candidate_multiplier = 4;
  PageRequest page = 5;
}

message SearchFinanceResponse {
  repeated FinanceSearchHit hits = 1;
  PageResponse page = 2;
  SearchDiagnostics diagnostics = 3;
}
