syntax = "proto3";

package finch.search.v1;

// Hybrid lexical+dense search over the finch corpus.
service SearchService {
  // Single-shot ranked search for one tenant.
  rpc Search(SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  // Opaque tenant scope; must be non-empty.
  string tenant_id = 1;
  // Query text; must be non-empty. Surrounding whitespace is trimmed.
  string text = 2;
  // Max hits to return. 0 leaves the server default in place.
  uint32 top_k = 3;
  // Per-source candidate fan-out (top_k * multiplier per index).
  // 0 leaves the server default in place.
  uint32 candidate_multiplier = 4;
}

message Hit {
  string document_id = 1;
  double fused_score = 2;
  optional uint32 dense_rank = 3;
  optional uint32 lexical_rank = 4;
  optional double dense_similarity = 5;
  optional double lexical_score = 6;
  repeated string sources = 7;
}

message Diagnostics {
  uint32 dense_candidates = 1;
  uint32 lexical_candidates = 2;
  uint32 fused_candidates = 3;
}

message SearchResponse {
  repeated Hit hits = 1;
  Diagnostics diagnostics = 2;
}
