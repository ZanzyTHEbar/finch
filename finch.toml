# Finch Configuration
# All features enabled by default. Sensitive keys live in the system keyring
# (Bun.secrets / libsecret), not in this file.

[database]
url = "file:./data/finch.db"
sqlite_vec_path = ""

[voyage]
model = "voyage-finance-2"

[llm]
adapter = "opencode"
base_url = "https://opencode.ai/zen/v1"
model = "muse-spark-1.3-contributor"

[bank]
adapter = "enablebanking"
base_url = "https://api.enablebanking.com"
application_id = ""
psu_ip = ""
psu_user_agent = "finch/0.1"

[features]
distillation = true
reranker = true
